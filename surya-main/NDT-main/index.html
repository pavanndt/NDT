<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NDT Program Manager Login</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="login-page">
  <div class="loginform-container">
    <div class="login-card">
      <div class="logo-box">
        <img src="logo.png" alt="Logo" class="login-logo" />
      </div>

      <h1>NDT Program Manager</h1>
      <p class="subtitle">Enter your is credentials to access your account.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" id="email" value="admin@simcondt.com" required />
        </div>

        <div class="form-group">
          <label for="password">PASSWORD</label>
          <div class="password-box">
            <input type="password" id="password" value="1234567890" required />
            <span class="toggle-password" id="togglePassword">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </span>
          </div>
        </div>

        <button type="submit" class="signin-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
